<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will Gacha</title>
    <meta name="description" content="William Wong, Soldering Samurai. Unemployed, but wicked cool. Crank the machine and get a project.">
    <link rel="icon" href="/mascot.jpg">
    <link rel="preload" as="image" href="/mascot.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:ital,wght@0,500;0,700;0,900;1,700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&text=%E9%BB%83%E3%81%8A%E3%81%BF%E3%81%8F%E3%81%98%E9%81%93%E5%A0%B4%E4%BE%8D%E5%A4%A7%E4%B8%AD%E5%B0%8F%E6%9C%AB%E5%90%89%E7%AC%AC%E7%95%AA&display=swap">
</head>

<body>
    <!-- Loading screen: static so it paints before any script arrives (src/loader.ts drives it).
         A ticket in the middle of a black screen prints its photo as the site loads, over a thin bar.
         Tear the stub off to enter: the hero draws itself in wireframe, then the floor opens. -->
    <div id="loader" class="loader" role="progressbar" aria-label="Loading William Wong" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="loader-sky"></div>
        <div class="loader-ground"></div>
        <div class="loader-stars" aria-hidden="true"></div>
        <i class="loader-horizon" aria-hidden="true"></i>
        <svg class="outline" aria-hidden="true"></svg>
        <div class="loader-centre">
            <div class="ticket-mount"></div>
            <button class="loader-retry" type="button" hidden>Couldn’t load. Reload</button>
        </div>
        <p class="loader-note" aria-hidden="true"><i class="dm"></i><span>For the best experience, open on a computer (NOT phone optimized: on a phone this dojo is a ronin with no master)</span><i class="dm"></i></p>
        <div class="loader-bar" aria-hidden="true"><b></b><span class="loader-percent"></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
